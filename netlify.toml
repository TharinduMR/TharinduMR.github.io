[build]
  # Navigate to backend to install dependencies
  command = "cd chatbot-backend && npm install"
  # Serve static files from the root of the repository
  publish = "."
  functions = "chatbot-backend/netlify/functions"

[build.environment]
  SECRETS_SCAN_ENABLED = "false"

[functions]
  # Extend timeout from default 10s to 26s for image generation APIs
  external_node_modules = ["@google/genai"]
  node_bundler = "esbuild"

[functions."api"]
  # Maximum timeout for serverless functions (26s max on Pro, 10s on free)
  timeout = 26

[[redirects]]
  # Redirect all /api/ traffic to the backend Express function
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
